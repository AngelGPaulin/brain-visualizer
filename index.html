<!DOCTYPE html>
<html>
<head>
    <title>Visualización 3D del Cerebro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">Atlas Cerebral Interactivo</h1>
            <p class="subtitle">Visualización 3D de la estructura y regiones de interés</p>
        </header>

        <div class="controls-panel">
            <div class="control-group">
                <label for="roi-select" class="control-label">Selecciona una Región de Interés (ROI):</label>
                <select id="roi-select" class="control-select"></select>
            </div>
            <div class="control-group">
                <label for="opacity-slider" class="control-label">Opacidad del Cerebro Base:</label>
                <div class="slider-container">
                    <input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="0.3" class="control-slider">
                    <span id="opacity-value" class="slider-value">0.3</span>
                </div>
            </div>
        </div>

        <div id="plot"></div>
    </div>
    
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
