<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Cerebral</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            height: 100vh;
            width: 100vw;
        }

        #three-container, #nii-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 0;
        }

        #ui-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 220px;
        }

        #ui-controls button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }

        #ui-controls button:hover {
            background-color: #0056b3;
        }

        #ui-controls button.active {
            background-color: #28a745;
        }

        #position-slider {
            width: 100%;
        }

        #nii-canvas {
            display: none;
        }

        /* === ESTILOS PARA LA PANTALLA DE CARGA === */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* Fondo oscuro semitransparente */
            display: flex; /* Para centrar el contenido */
            justify-content: center; /* Centrado horizontal */
            align-items: center; /* Centrado vertical */
            z-index: 999; /* Asegura que esté encima de todo lo demás */
            color: white;
            font-family: Arial, sans-serif;
            font-size: 1.2em;
            flex-direction: column; /* Para apilar spinner y texto */
        }

        .spinner-container {
            text-align: center;
        }

        .loading-gif {
            width: 200px; /* Ajusta el tamaño de tu GIF */
            height: 200px;
            margin-bottom: 20px; /* Espacio entre el GIF y el texto */
        }

        /* Si usaras un CSS Spinner en lugar de GIF, iría aquí */
        /*
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        */
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner-container">
            <img src="assets/extras/Pantalla_carga_brain.gif" alt="Cargando modelo 3D..." class="loading-gif">
            <p>Cargando modelo 3D...</p>
        </div>
    </div>

    <div id="ui-controls">
        <button id="load-model-btn">Cargar Modelo</button>

        <input type="file" id="model-input" accept=".obj,.nii,.nii.gz" style="display: none;">

        <button id="sagittal-cut">Corte Sagital</button>
        <button id="coronal-cut">Corte Coronal</button>
        <button id="axial-cut">Corte Axial</button>

        <label for="position-slider">Posición de Corte:</label>
        <input type="range" id="position-slider" min="0" max="100" value="50">

        <button id="toggle-view-btn">Cambiar Vista</button>
    </div>

    <div id="three-container"></div>

    <canvas id="nii-canvas"></canvas>

    <script type="module" src="./index.js"></script>

</body>
</html>
